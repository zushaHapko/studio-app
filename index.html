        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }

        let currentTab = 'clients';
        let clientSearchQuery = '';
        let selectedWorkoutClientId = appData.clients[0]?.id || '';
        
        // Aktív edzés (Hevy Live Session)
        let activeWorkout = null;
        let workoutTimerInterval = null;

        // Pihenőidő számláló (Rest Timer)
        let restTimerInterval = null;
        let restRemainingSeconds = 0;
        let restTotalSeconds = 90;

        // Sablonok / Gyakorlatok al-nézet
        let routinesSubTab = 'routines'; // 'routines' | 'exercises'
        let exerciseMuscleFilter = 'Összes';

        // Vendég részletes nézet állapot
        let viewingClientId = null;
        let clientProfileTab = 'history'; // 'history' | 'photos' | 'measurements'

        /**
         * ADATMENTÉS ÉS TÉMA ALKALMAZÁS
         */
        function loadAppData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {
                console.error('Betöltési hiba:', e);
            }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        function saveAppData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                applyTheme(appData.studio.theme);
                updateHeaderUI();
            } catch (e) {
                showToast('A böngésző tárhelye megtelt! Exportáld az adatokat vagy törölj régi fotót.', 'error');
            }
        }

        function applyTheme(themeId) {
            const validTheme = THEMES[themeId] ? themeId : 'sage';
            document.documentElement.setAttribute('data-theme', validTheme);
        }

        function cycleThemeQuick() {
            const keys = Object.keys(THEMES);
            const currentIdx = keys.indexOf(appData.studio.theme);
            const nextTheme = keys[(currentIdx + 1) % keys.length];
            appData.studio.theme = nextTheme;
            saveAppData();
            if (currentTab === 'studio') renderCurrentView();
            showToast(`Téma: ${THEMES[nextTheme].name}`);
        }

        function updateHeaderUI() {
            document.getElementById('header-title').textContent = appData.studio.title;
            document.getElementById('header-subtitle').textContent = appData.studio.subtitle;
        }

        /**
         * TOAST ÉRTESÍTÉS
         */
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600 text-white' : 'bg-theme-text text-white';
            el.className = `${bg} px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold flex items-center gap-2 animate-view pointer-events-auto`;
            el.innerHTML = `<i class="ph-fill ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-base text-theme-accent"></i><span>${escapeHtml(msg)}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.25s';
                setTimeout(() => el.remove(), 250);
            }, 2500);
        }

        /**
         * NAVIGÁCIÓ
         */
        function switchTab(tab) {
            currentTab = tab;
            viewingClientId = null;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-theme-primary', 'bg-theme-primarySoft');
                btn.classList.add('text-theme-muted');
                const icon = btn.querySelector('i');
                if (icon) icon.className = icon.className.replace('ph-fill', 'ph');
            });

            const activeBtn = document.getElementById(`nav-${tab}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-theme-muted');
                activeBtn.classList.add('text-theme-primary', 'bg-theme-primarySoft');
                const icon = activeBtn.querySelector('i');
                if (icon) icon.className = icon.className.replace('ph ', 'ph-fill ');
            }

            updateActiveWorkoutBanner();
            renderCurrentView();
        }

        function renderCurrentView() {
            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            if (viewingClientId) {
                renderClientProfileView(main, viewingClientId);
                return;
            }

            if (currentTab === 'clients') renderClientsTab(main);
            else if (currentTab === 'workout') renderWorkoutTab(main);
            else if (currentTab === 'routines') renderRoutinesTab(main);
            else if (currentTab === 'studio') renderStudioTab(main);
        }

        /**
         * 1. VENDÉGEK FÜL (Clients)
         */
        function renderClientsTab(container) {
            const filtered = appData.clients.filter(c =>
                c.name.toLowerCase().includes(clientSearchQuery.toLowerCase()) ||
                c.goal.toLowerCase().includes(clientSearchQuery.toLowerCase())
            );

            container.innerHTML = `
                <div class="animate-view space-y-4">
                    <!-- Kereső és Új vendég gomb -->
                    <div class="flex items-center gap-2">
                        <div class="relative flex-1">
                            <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-theme-muted text-lg"></i>
                            <input type="text" value="${escapeHtml(clientSearchQuery)}" oninput="clientSearchQuery=this.value; renderClientsTab(document.getElementById('main-content'))"
                                placeholder="Vendég keresése név vagy cél alapján..."
                                class="w-full pl-10 pr-4 py-3 bg-theme-card rounded-2xl text-sm border border-theme-border focus:outline-none focus:border-theme-primary shadow-card">
                        </div>
                        <button onclick="openNewClientModal()" class="px-4 py-3 bg-theme-primary text-white font-heading font-bold text-sm rounded-2xl shadow-card hover:bg-theme-primaryDark transition-all flex items-center gap-1.5 shrink-0 active:scale-95">
                            <i class="ph-bold ph-user-plus text-base"></i>
                            <span>Új</span>
                        </button>
                    </div>

                    <!-- Vendég kártyák -->
                    <div class="space-y-3">
                        ${filtered.length === 0 ? `
                            <div class="bg-theme-card rounded-3xl p-8 text-center border border-theme-border">
                                <i class="ph ph-users text-3xl text-theme-muted mb-2"></i>
                                <p class="font-heading font-bold text-sm">Nincs megjeleníthető vendég</p>
                                <p class="text-xs text-theme-muted mt-1">Adj hozzá új vendéget a fenti gombbal!</p>
                            </div>
                        ` : filtered.map(client => {
                            const history = appData.workoutHistory
                                .filter(w => w.clientId === client.id)
                                .sort((a, b) => new Date(b.date) - new Date(a.date));
                            const lastWorkout = history[0];
                            const initials = getInitials(client.name);

                            return `
                                <div onclick="openClientProfile('${client.id}')" class="bg-theme-card rounded-3xl p-4 shadow-soft border border-theme-border hover:border-theme-primary/60 transition-all cursor-pointer active:scale-[0.99]">
                                    <div class="flex items-center justify-between gap-3">
                                        <div class="flex items-center gap-3.5 min-w-0">
                                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-heading font-bold text-base shrink-0 shadow-sm" style="background-color: ${client.avatarColor || 'var(--color-primary)'}">
                                                ${initials}
                                            </div>
                                            <div class="min-w-0">
                                                <h3 class="font-heading font-bold text-base text-theme-text truncate">${escapeHtml(client.name)}</h3>
                                                <p class="text-xs text-theme-muted truncate flex items-center gap-1 mt-0.5">
                                                    <i class="ph-fill ph-target text-theme-primary"></i> ${escapeHtml(client.goal)}
                                                </p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-1.5 shrink-0">
                                            <button onclick="event.stopPropagation(); startQuickWorkoutForClient('${client.id}')" class="w-9 h-9 rounded-xl bg-theme-primarySoft text-theme-primaryDark hover:bg-theme-primary hover:text-white flex items-center justify-center transition-all" title="Edzés indítása">
                                                <i class="ph-bold ph-play text-base"></i>
                                            </button>
                                            <i class="ph ph-caret-right text-theme-muted text-lg"></i>
                                        </div>
                                    </div>

                                    <div class="mt-3 pt-3 border-t border-theme-border/80 flex items-center justify-between text-[11px] text-theme-muted">
                                        <span>Testsúly: <strong class="text-theme-text">${client.weight} kg</strong> • ${client.age} év</span>
                                        <span>
                                            ${lastWorkout 
                                                ? `Utolsó edzés: <strong class="text-theme-primaryDark">${formatDateHu(lastWorkout.date)}</strong>` 
                                                : 'Még nincs edzés'}
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function openClientProfile(clientId) {
            viewingClientId = clientId;
            clientProfileTab = 'history';
            renderCurrentView();
        }

        function startQuickWorkoutForClient(clientId) {
            selectedWorkoutClientId = clientId;
            switchTab('workout');
        }

        /**
         * VENDÉG RÉSZLETES PROFIL NÉZET (3 al-fül: Edzéselőzmények | Haladás & Fotók | Méretek)
         */
        function renderClientProfileView(container, clientId) {
            const client = appData.clients.find(c => c.id === clientId);
            if (!client) {
                viewingClientId = null;
                renderCurrentView();
                return;
            }

            const initials = getInitials(client.name);
            const workouts = appData.workoutHistory
                .filter(w => w.clientId === client.id)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = `
                <div class="animate-view space-y-4">
                    <!-- Vissza gomb és Edzés indítás -->
                    <div class="flex items-center justify-between">
                        <button onclick="viewingClientId=null; renderCurrentView()" class="flex items-center gap-1.5 text-xs font-bold text-theme-muted hover:text-theme-text py-1">
                            <i class="ph-bold ph-arrow-left text-base"></i> Vissza a vendégekhez
                        </button>
                        <button onclick="startQuickWorkoutForClient('${client.id}')" class="px-3.5 py-2 bg-theme-primary text-white font-heading font-bold text-xs rounded-2xl shadow-card flex items-center gap-1.5">
                            <i class="ph-bold ph-play"></i> Edzés indítása
                        </button>
                    </div>

                    <!-- Vendég Fejléc Kártya -->
                    <div class="bg-theme-card rounded-3xl p-4 shadow-soft border border-theme-border">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-3.5">
                                <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white font-heading font-bold text-xl shrink-0" style="background-color: ${client.avatarColor || 'var(--color-primary)'}">
                                    ${initials}
                                </div>
                                <div>
                                    <h2 class="font-heading font-bold text-lg text-theme-text">${escapeHtml(client.name)}</h2>
                                    <p class="text-xs text-theme-muted">${escapeHtml(client.goal)}</p>
                                    <p class="text-[11px] font-semibold text-theme-primaryDark mt-1">${client.age} év • ${client.weight} kg • ${workouts.length} edzés</p>
                                </div>
                            </div>
                            <button onclick="openEditClientModal('${client.id}')" class="w-9 h-9 rounded-xl bg-theme-subtle text-theme-text flex items-center justify-center hover:bg-theme-primarySoft transition-all" title="Adatok szerkesztése">
                                <i class="ph-bold ph-pencil-simple text-base"></i>
                            </button>
                        </div>

                        ${client.notes ? `
                            <div class="mt-3 p-3 rounded-2xl bg-theme-accentSoft text-xs text-theme-text flex items-start gap-2">
                                <i class="ph-fill ph-first-aid-kit text-theme-primaryDark text-base shrink-0 mt-0.5"></i>
                                <span>${escapeHtml(client.notes)}</span>
                            </div>
                        ` : ''}
                    </div>

                    <!-- 3 Al-fül választó -->
                    <div class="grid grid-cols-3 gap-1.5 bg-theme-subtle p-1.5 rounded-2xl">
                        <button onclick="clientProfileTab='history'; renderCurrentView()" class="py-2 rounded-xl text-xs font-heading font-bold transition-all ${clientProfileTab === 'history' ? 'bg-theme-card text-theme-text shadow-sm' : 'text-theme-muted'}">
                            Edzések (${workouts.length})
                        </button>
                        <button onclick="clientProfileTab='photos'; renderCurrentView()" class="py-2 rounded-xl text-xs font-heading font-bold transition-all ${clientProfileTab === 'photos' ? 'bg-theme-card text-theme-text shadow-sm' : 'text-theme-muted'}">
                            Fotók (${(client.photos || []).length})
                        </button>
                        <button onclick="clientProfileTab='measurements'; renderCurrentView()" class="py-2 rounded-xl text-xs font-heading font-bold transition-all ${clientProfileTab === 'measurements' ? 'bg-theme-card text-theme-text shadow-sm' : 'text-theme-muted'}">
                            Méretek
                        </button>
                    </div>

                    <!-- Al-fül tartalom -->
                    <div id="client-subtab-content">
                        ${clientProfileTab === 'history' ? renderClientHistorySubtab(workouts) : ''}
                        ${clientProfileTab === 'photos' ? renderClientPhotosSubtab(client) : ''}
                        ${clientProfileTab === 'measurements' ? renderClientMeasurementsSubtab(client) : ''}
                    </div>
                </div>
            `;
        }

        function renderClientHistorySubtab(workouts) {
            if (workouts.length === 0) {
                return `
                    <div class="bg-theme-card rounded-3xl p-8 text-center border border-theme-border">
                        <i class="ph ph-barbell text-3xl text-theme-muted mb-2"></i>
                        <p class="font-heading font-bold text-sm">Még nincs rögzített edzés</p>
                        <p class="text-xs text-theme-muted mt-1">Indíts egy edzést az Edzés fülön!</p>
                    </div>
                `;
            }

            return `
                <div class="space-y-3">
                    ${workouts.map(w => `
                        <div class="bg-theme-card rounded-3xl p-4 shadow-card border border-theme-border space-y-3">
                            <div class="flex items-start justify-between">
                                <div>
                                    <h4 class="font-heading font-bold text-sm text-theme-text">${escapeHtml(w.title)}</h4>
                                    <p class="text-[11px] text-theme-muted mt-0.5">${formatDateHu(w.date)} • ${formatDuration(w.durationSeconds)}</p>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    ${w.prCount > 0 ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">🏆 ${w.prCount} PR</span>` : ''}
                                    <span class="px-2.5 py-0.5 rounded-full bg-theme-primarySoft text-theme-primaryDark text-[11px] font-bold">${w.totalVolume.toLocaleString('hu-HU')} kg</span>
                                </div>
                            </div>

                            <div class="space-y-1.5 pt-2 border-t border-theme-border/70">
                                ${w.exercises.map(ex => {
                                    const exInfo = getExerciseById(ex.exerciseId);
                                    const bestSet = ex.sets.reduce((best, s) => (s.weight > (best?.weight || -1) ? s : best), null);
                                    return `
                                        <div class="flex items-center justify-between text-xs">
                                            <span class="font-medium text-theme-text truncate pr-2">${ex.sets.length} × ${escapeHtml(exInfo.name)}</span>
                                            <span class="text-theme-muted font-mono text-[11px] shrink-0">
                                                ${bestSet ? `Max: ${bestSet.weight} kg × ${bestSet.reps}` : ''}
                                            </span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderClientPhotosSubtab(client) {
            const photos = (client.photos || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));

            return `
                <div class="space-y-3">
                    <button onclick="openUploadClientPhotoModal('${client.id}')" class="w-full py-3.5 bg-theme-primary text-white font-heading font-bold text-xs rounded-2xl shadow-card flex items-center justify-center gap-2 hover:bg-theme-primaryDark transition-all">
                        <i class="ph-bold ph-camera-plus text-base"></i> Új állapotfotó feltöltése
                    </button>

                    ${photos.length === 0 ? `
                        <div class="bg-theme-card rounded-3xl p-8 text-center border border-theme-border">
                            <i class="ph ph-camera text-3xl text-theme-muted mb-2"></i>
                            <p class="font-heading font-bold text-sm">Még nincs állapotfotó</p>
                            <p class="text-xs text-theme-muted mt-1">Tölts fel előtte/utána fotókat a vizuális fejlődés követéséhez!</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-2 gap-3">
                            ${photos.map(p => `
                                <div onclick="openPhotoLightbox('${client.id}', '${p.id}')" class="bg-theme-card rounded-2xl overflow-hidden border border-theme-border shadow-card cursor-pointer group">
                                    <div class="aspect-[3/4] bg-theme-subtle relative overflow-hidden">
                                        <img src="${p.dataUrl}" alt="${escapeHtml(p.label)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                        <span class="absolute bottom-2 left-2 bg-black/65 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded-lg">
                                            ${p.weight ? p.weight + ' kg' : formatDateHu(p.date)}
                                        </span>
                                    </div>
                                    <div class="p-2.5">
                                        <p class="font-heading font-bold text-xs text-theme-text truncate">${escapeHtml(p.label)}</p>
                                        <p class="text-[10px] text-theme-muted">${formatDateHu(p.date)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderClientMeasurementsSubtab(client) {
            const list = (client.measurements || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));

            return `
                <div class="space-y-3">
                    <button onclick="openAddMeasurementModal('${client.id}')" class="w-full py-3.5 bg-theme-primary text-white font-heading font-bold text-xs rounded-2xl shadow-card flex items-center justify-center gap-2 hover:bg-theme-primaryDark transition-all">
                        <i class="ph-bold ph-ruler text-base"></i> Új mérés rögzítése
                    </button>

                    ${list.length === 0 ? `
                        <div class="bg-theme-card rounded-3xl p-8 text-center border border-theme-border">
                            <p class="text-xs text-theme-muted">Még nincs rögzített körméret adat.</p>
                        </div>
                    ` : list.map((m, idx) => `
                        <div class="bg-theme-card rounded-3xl p-4 border border-theme-border shadow-card">
                            <div class="flex items-center justify-between mb-2.5">
                                <span class="text-xs font-heading font-bold text-theme-text">${formatDateHu(m.date)}</span>
                                <span class="px-2.5 py-0.5 rounded-full bg-theme-primarySoft text-theme-primaryDark text-xs font-bold">${m.weight} kg</span>
                            </div>
                            <div class="grid grid-cols-4 gap-2 text-center bg-theme-subtle/70 p-2.5 rounded-2xl text-xs">
                                <div><span class="block text-[10px] text-theme-muted">Derék</span><strong>${m.waist || '-'} cm</strong></div>
                                <div><span class="block text-[10px] text-theme-muted">Csípő</span><strong>${m.hips || '-'} cm</strong></div>
                                <div><span class="block text-[10px] text-theme-muted">Kar</span><strong>${m.arm || '-'} cm</strong></div>
                                <div><span class="block text-[10px] text-theme-muted">Comb</span><strong>${m.thigh || '-'} cm</strong></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        /**
         * 2. EDZÉS FÜL (HEVY LIVE WORKOUT LOGIKA)
         */
        function renderWorkoutTab(container) {
            // Ha van folyamatban lévő élő edzés, azt jelenítjük meg
            if (activeWorkout) {
                renderActiveWorkoutSession(container);
                return;
            }

            // Különben indító képernyő: Vendég választás + Üres edzés vagy Sablon betöltése
            container.innerHTML = `
                <div class="animate-view space-y-5">
                    <div>
                        <h2 class="font-heading font-bold text-xl text-theme-text">Edzés indítása</h2>
                        <p class="text-xs text-theme-muted">Válassz vendéget, majd indíts üres edzést vagy tölts be sablont</p>
                    </div>

                    <!-- Vendég választó -->
                    <div class="bg-theme-card rounded-3xl p-4 shadow-soft border border-theme-border space-y-2.5">
                        <label class="block text-xs font-heading font-bold text-theme-text">Kinek tartod az edzést?</label>
                        <select id="workout-client-select" onchange="selectedWorkoutClientId=this.value" class="w-full px-3.5 py-3 bg-theme-subtle rounded-2xl text-sm font-semibold text-theme-text border border-theme-border focus:outline-none focus:border-theme-primary">
                            ${appData.clients.map(c => `<option value="${c.id}" ${c.id === selectedWorkoutClientId ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.goal)})</option>`).join('')}
                        </select>
                    </div>

                    <!-- Üres edzés indítása gomb -->
                    <button onclick="startEmptyWorkout()" class="w-full py-4 bg-theme-primary text-white font-heading font-bold text-sm rounded-3xl shadow-soft hover:bg-theme-primaryDark transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
                        <i class="ph-bold ph-plus-circle text-xl"></i>
                        <span>Üres edzés indítása</span>
                    </button>

                    <!-- Sablon betöltése (Routines) -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h3 class="font-heading font-bold text-sm text-theme-text">Gyors indítás sablonból</h3>
                            <button onclick="switchTab('routines')" class="text-xs font-semibold text-theme-primaryDark hover:underline">Összes sablon</button>
                        </div>

                        <div class="space-y-2.5">
                            ${appData.routines.map(r => {
                                const exNames = r.exercises.map(item => getExerciseById(item.exerciseId).name).join(', ');
                                return `
                                    <div class="bg-theme-card rounded-3xl p-4 border border-theme-border shadow-card flex items-center justify-between gap-3">
                                        <div class="min-w-0">
                                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-theme-primarySoft text-theme-primaryDark">${escapeHtml(r.category)}</span>
                                            <h4 class="font-heading font-bold text-sm text-theme-text mt-1.5">${escapeHtml(r.name)}</h4>
                                            <p class="text-xs text-theme-muted truncate mt-0.5">${escapeHtml(exNames)}</p>
                                        </div>
                                        <button onclick="startWorkoutFromRoutine('${r.id}')" class="px-3.5 py-2.5 bg-theme-accentSoft text-theme-text hover:bg-theme-accent font-heading font-bold text-xs rounded-2xl shrink-0 transition-all">
                                            Indítás
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function startEmptyWorkout() {
            if (!selectedWorkoutClientId && appData.clients.length > 0) {
                selectedWorkoutClientId = appData.clients[0].id;
            }
            if (!selectedWorkoutClientId) {
                showToast('Előbb vegyél fel egy vendéget!', 'error');
                return;
            }

            activeWorkout = {
                clientId: selectedWorkoutClientId,
                title: 'Egyéni edzés',
                startTime: Date.now(),
                elapsedSeconds: 0,
                exercises: []
            };
            startWorkoutClock();
            renderCurrentView();
        }

        function startWorkoutFromRoutine(routineId) {
            const routine = appData.routines.find(r => r.id === routineId);
            if (!routine) return;

            if (!selectedWorkoutClientId && appData.clients.length > 0) {
                selectedWorkoutClientId = appData.clients[0].id;
            }
            if (!selectedWorkoutClientId) {
                showToast('Előbb vegyél fel egy vendéget!', 'error');
                return;
            }

            activeWorkout = {
                clientId: selectedWorkoutClientId,
                title: routine.name,
                startTime: Date.now(),
                elapsedSeconds: 0,
                exercises: routine.exercises.map(item => {
                    // Előző edzésből betöltjük az ajánlott súlyokat, ha vannak
                    const prevSets = getPreviousSetsForClientExercise(selectedWorkoutClientId, item.exerciseId);
                    const sets = [];
                    for (let i = 0; i < item.defaultSets; i++) {
                        sets.push({
                            weight: prevSets[i]?.weight ?? item.defaultWeight ?? 0,
                            reps: prevSets[i]?.reps ?? item.defaultReps ?? 10,
                            completed: false,
                            isPR: false
                        });
                    }
                    return {
                        uid: 'we_' + Math.random().toString(36).slice(2, 9),
                        exerciseId: item.exerciseId,
                        sets
                    };
                })
            };

            startWorkoutClock();
            switchTab('workout');

        function startWorkoutClock() {
            if (workoutTimerInterval) clearInterval(workoutTimerInterval);
            updateActiveWorkoutBanner();
            workoutTimerInterval = setInterval(() => {
                if (!activeWorkout) return;
                activeWorkout.elapsedSeconds = Math.floor((Date.now() - activeWorkout.startTime) / 1000);
                const formatted = formatDuration(activeWorkout.elapsedSeconds);
                const liveEl = document.getElementById('live-workout-clock');
                if (liveEl) liveEl.textContent = formatted;
                const bannerEl = document.getElementById('banner-workout-timer');
                if (bannerEl) bannerEl.textContent = formatted;
            }, 1000);
        }

        function updateActiveWorkoutBanner() {
            const banner = document.getElementById('active-workout-banner');
            if (activeWorkout && currentTab !== 'workout') {
                const client = appData.clients.find(c => c.id === activeWorkout.clientId);
                document.getElementById('banner-workout-info').textContent = `${client?.name || 'Vendég'} • ${activeWorkout.title}`;
                document.getElementById('banner-workout-timer').textContent = formatDuration(activeWorkout.elapsedSeconds);
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        function updateSetField(exIdx, setIdx, field, val) {
            if (!activeWorkout) return;

        function toggleSetComplete(exIdx, setIdx) {
            if (!activeWorkout) return;
            const set = activeWorkout.exercises[exIdx].sets[setIdx];
            set.completed = !set.completed;

            // PR ellenőrzés
            const exId = activeWorkout.exercises[exIdx].exerciseId;
            const histMax = getHistoricalMaxWeight(activeWorkout.clientId, exId);
            set.isPR = set.completed && set.weight > 0 && histMax > 0 && set.weight > histMax;

            if (set.completed) {
                if (set.isPR) {
                    showToast('🏆 Új egyéni rekord (PR)!');
                }
                // Automatikus pihenőidő visszaszámláló indítása!
                startRestTimer(appData.studio.defaultRestSeconds || 90);
            }

            renderActiveWorkoutSession(document.getElementById('main-content'));
        }

        function addSetToExercise(exIdx) {
            if (!activeWorkout) return;
            const sets = activeWorkout.exercises[exIdx].sets;
            const lastSet = sets[sets.length - 1] || { weight: 0, reps: 10 };
            sets.push({
                weight: lastSet.weight,
                reps: lastSet.reps,
                completed: false,
                isPR: false
            });
            renderActiveWorkoutSession(document.getElementById('main-content'));
        }

        function removeLastSet(exIdx) {
            if (!activeWorkout) return;
            const sets = activeWorkout.exercises[exIdx].sets;
            if (sets.length > 1) {
                sets.pop();
                renderActiveWorkoutSession(document.getElementById('main-content'));

        function finishActiveWorkout() {

            // Csak a kipipált szetteket mentjük (ha egy sincs kipipálva, figyelmeztetünk)
            const completedExercises = activeWorkout.exercises

        /**
         * PIHENŐIDŐ VISSZASZÁMLÁLÓ (REST TIMER + WEB AUDIO CSIPOGÁS)
         */
        function startRestTimer(seconds) {
            if (restTimerInterval) clearInterval(restTimerInterval);
            restTotalSeconds = seconds;
            restRemainingSeconds = seconds;

            const bar = document.getElementById('rest-timer-bar');
            bar.classList.remove('hidden');
            updateRestTimerUI();

            restTimerInterval = setInterval(() => {
                restRemainingSeconds--;
                if (restRemainingSeconds <= 0) {
                    playBeepSound();
                    stopRestTimer();
                    showToast('⏰ Pihenőidő lejárt! Jöhet a következő szett.');
                } else {
                    updateRestTimerUI();
                }
            }, 1000);
        }

        function adjustRestTimer(delta) {
            restRemainingSeconds = Math.max(5, restRemainingSeconds + delta);
            restTotalSeconds = Math.max(restTotalSeconds, restRemainingSeconds);
            updateRestTimerUI();
        }

        function stopRestTimer() {
            if (restTimerInterval) clearInterval(restTimerInterval);
            document.getElementById('rest-timer-bar').classList.add('hidden');
        }

        function updateRestTimerUI() {
            const mins = Math.floor(restRemainingSeconds / 60);
            const secs = restRemainingSeconds % 60;
            document.getElementById('rest-timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            const pct = Math.min(100, Math.round((restRemainingSeconds / restTotalSeconds) * 100));
            document.getElementById('rest-timer-progress').style.width = `${pct}%`;
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.45);
            } catch (e) { /* Audio tiltva böngészőben */ }
        }

        function selectTheme(themeId) {
            appData.studio.theme = themeId;

        function saveStudioSettings() {
            appData.studio.title = document.getElementById('studio-title-input').value.trim() || 'Mozgásstúdió';
            appData.studio.subtitle = document.getElementById('studio-sub-input').value.trim() || 'Személyi Edzői Rendszer';
            appData.studio.defaultRestSeconds = parseInt(document.getElementById('studio-rest-input').value) || 90;
            saveAppData();
            showToast('Stúdió beállítások elmentve!');
        }

        function exportDataJson() {
            const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const a = document.createElement('a');
            a.href = jsonStr;
            a.download = `edzoi_studio_adatbazis_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast('Adatbázis exportálva!');
        }

        function importDataJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.clients && parsed.exercises) {
                        appData = parsed;
                        saveAppData();
                        renderCurrentView();
                        showToast('Adatbázis sikeresen betöltve!');
                    } else {
                        showToast('Érvénytelen fájl formátum!', 'error');
                    }
                } catch (err) {
                    showToast('Hiba a fájl beolvasásakor!', 'error');
                }
            };
            reader.readAsText(file);
        }

            e.preventDefault();

            const weight = parseFloat(fd.get('weight')) || 70;
            const today = new Date().toISOString().slice(0, 10);

            const newClient = {
                id: 'c_' + Date.now(),
                name: fd.get('name').trim(),
                age: parseInt(fd.get('age')) || 30,
                goal: fd.get('goal').trim(),
                weight,
                notes: fd.get('notes').trim(),
                avatarColor: fd.get('avatarColor') || '#7C968B',
                measurements: [{ date: today, weight, waist: 0, hips: 0, arm: 0, thigh: 0 }],
                photos: []
            };

            appData.clients.unshift(newClient);
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast(`${newClient.name} hozzáadva!`);

            client.name = fd.get('name').trim();
            client.age = parseInt(fd.get('age')) || client.age;
            client.weight = parseFloat(fd.get('weight')) || client.weight;
            client.goal = fd.get('goal').trim();
            client.notes = fd.get('notes').trim();
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Vendég adatai frissítve!');

            appData.clients = appData.clients.filter(c => c.id !== clientId);

            viewingClientId = null;
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Vendég törölve');

            const muscles = ['Összes', 'Mell', 'Hát', 'Láb & Far', 'Váll', 'Kar', 'Törzs'];
            const list = appData.exercises.filter(ex => {
                const matchM = pickerMuscle === 'Összes' || ex.muscle === pickerMuscle;
                const matchS = ex.name.toLowerCase().includes(pickerSearch.toLowerCase());
                return matchM && matchS;

            if (targetMode === 'workout' && activeWorkout) {

                    uid: 'we_' + Math.random().toString(36).slice(2, 9),
                    exerciseId,
                    sets: [
                        { weight: prevSets[0]?.weight ?? 0, reps: prevSets[0]?.reps ?? 10, completed: false, isPR: false },
                        { weight: prevSets[1]?.weight ?? prevSets[0]?.weight ?? 0, reps: prevSets[1]?.reps ?? prevSets[0]?.reps ?? 10, completed: false, isPR: false },
                        { weight: prevSets[2]?.weight ?? prevSets[0]?.weight ?? 0, reps: prevSets[2]?.reps ?? prevSets[0]?.reps ?? 10, completed: false, isPR: false }
                    ]
                });
                closeModal();
                renderCurrentView();
            } else if (targetMode === 'routine') {
                draftRoutineExercises.push({ exerciseId, defaultSets: 3, defaultReps: 10, defaultWeight: 0 });

        function saveNewRoutine() {
            if (!draftRoutineName.trim()) {
                showToast('Add meg a sablon nevét!', 'error');
                return;

            if (draftRoutineExercises.length === 0) {
                showToast('Adj hozzá legalább egy gyakorlatot!', 'error');
                return;
            }
            appData.routines.unshift({
                id: 'r_' + Date.now(),
                name: draftRoutineName.trim(),
                category: draftRoutineCategory,
                exercises: draftRoutineExercises
            });
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Új sablon elmentve!');

                        <label class="block text-xs font-medium text-theme-muted mb-1">Gyakorlat neve *</label>
                        <input type="text" name="name" required placeholder="pl. Kábeles tárogatás" class="w-full px-3.5 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-theme-muted mb-1">Izomcsoport</label>
                        <select name="muscle" class="w-full px-3.5 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                            <option value="Mell">Mell</option>
                            <option value="Hát">Hát</option>
                            <option value="Láb & Far">Láb & Far</option>
                            <option value="Váll">Váll</option>
                            <option value="Kar">Kar</option>
                            <option value="Törzs">Törzs</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-theme-primary text-white font-heading font-bold text-sm rounded-2xl">Gyakorlat mentése</button>
                </form>
            `);
        }

        function submitNewExercise(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            appData.exercises.unshift({
                id: 'ex_' + Date.now(),
                name: fd.get('name').trim(),
                muscle: fd.get('muscle')
            });
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Új gyakorlat hozzáadva!');
        }

        // ÁLLAPOTFOTÓ FELTÖLTÉSE (800px Canvas tömörítéssel)
        function openUploadClientPhotoModal(clientId) {
            const client = appData.clients.find(c => c.id === clientId);
            if (!client) return;
            const today = new Date().toISOString().slice(0, 10);

            openModal(`
                <form onsubmit="submitClientPhotoUpload(event, '${client.id}')" class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-heading font-bold text-lg">Állapotfotó feltöltése</h3>
                        <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-theme-subtle flex items-center justify-center"><i class="ph-bold ph-x"></i></button>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Címke *</label>
                            <input type="text" name="label" required placeholder="pl. 1. hét – Elölről" class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Dátum *</label>
                            <input type="date" name="date" value="${today}" required class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-theme-muted mb-1">Aktuális testsúly (kg)</label>
                        <input type="number" step="0.1" name="weight" value="${client.weight}" class="w-full px-3.5 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-theme-muted mb-1">Fotó kiválasztása *</label>
                        <label class="flex flex-col items-center justify-center w-full h-36 bg-theme-card border-2 border-dashed border-theme-primary/50 rounded-2xl cursor-pointer hover:bg-theme-primarySoft/30 transition-all overflow-hidden">
                            <div id="photo-upload-placeholder" class="text-center p-4">
                                <i class="ph-bold ph-camera-plus text-2xl text-theme-primary mb-1"></i>
                                <p class="text-xs font-bold">Koppints a kép kiválasztásához</p>
                                <p class="text-[10px] text-theme-muted mt-0.5">Automatikus helytakarékos tömörítés (800px)</p>
                            </div>
                            <img id="photo-upload-preview" class="hidden w-full h-full object-contain" alt="Előnézet">
                            <input type="file" id="client-photo-input" accept="image/*" required onchange="previewClientPhoto(event)" class="hidden">
                        </label>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-theme-muted mb-1">Jegyzet (opcionális)</label>
                        <input type="text" name="note" placeholder="pl. Reggeli mérés" class="w-full px-3.5 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                    </div>

                    <button type="submit" id="save-photo-btn" class="w-full py-3.5 bg-theme-primary text-white font-heading font-bold text-sm rounded-2xl shadow-card">Fotó mentése</button>
                </form>
            `);
        }

        function previewClientPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.getElementById('photo-upload-preview');
                img.src = ev.target.result;
                img.classList.remove('hidden');
                document.getElementById('photo-upload-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function submitClientPhotoUpload(e, clientId) {
            e.preventDefault();
            const file = document.getElementById('client-photo-input').files[0];
            if (!file) return;

            const btn = document.getElementById('save-photo-btn');
            btn.disabled = true;
            btn.textContent = 'Kép optimalizálása...';

            const fd = new FormData(e.target);
            compressImageTo800px(file, 800, 0.8, (dataUrl) => {
                const client = appData.clients.find(c => c.id === clientId);
                if (!client) return;
                if (!client.photos) client.photos = [];

                client.photos.push({
                    id: 'ph_' + Date.now(),
                    label: fd.get('label').trim(),
                    date: fd.get('date'),
                    weight: parseFloat(fd.get('weight')) || client.weight,
                    note: fd.get('note').trim(),
                    dataUrl
                });

                saveAppData();
                closeModal();
                renderCurrentView();
                showToast('Állapotfotó elmentve!');
            });
        }

        function compressImageTo800px(file, maxWidth, quality, cb) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width;
                    let h = img.height;
                    if (w > maxWidth) {
                        h = Math.round((h * maxWidth) / w);
                        w = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    cb(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // NAGYÍTHATÓ FOTÓ ELŐNÉZET (LIGHTBOX)
        function openPhotoLightbox(clientId, photoId) {
            const client = appData.clients.find(c => c.id === clientId);
            const photo = client?.photos?.find(p => p.id === photoId);
            if (!photo) return;

            openModal(`
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-heading font-bold text-base">${escapeHtml(photo.label)}</h3>
                            <p class="text-xs text-theme-muted">${formatDateHu(photo.date)} ${photo.weight ? `• ${photo.weight} kg` : ''}</p>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-theme-subtle flex items-center justify-center"><i class="ph-bold ph-x"></i></button>
                    </div>
                    <div class="rounded-2xl overflow-hidden bg-black/5 max-h-[60vh] flex items-center justify-center">
                        <img src="${photo.dataUrl}" alt="${escapeHtml(photo.label)}" class="max-h-[60vh] w-auto object-contain">
                    </div>
                    ${photo.note ? `<p class="text-xs text-theme-text bg-theme-card p-3 rounded-2xl border border-theme-border">${escapeHtml(photo.note)}</p>` : ''}
                    <button onclick="deleteClientPhoto('${client.id}', '${photo.id}')" class="w-full py-2.5 text-red-600 text-xs font-bold">Fotó törlése</button>
                </div>
            `);
        }

        function deleteClientPhoto(clientId, photoId) {
            const client = appData.clients.find(c => c.id === clientId);
            if (!client) return;
            client.photos = (client.photos || []).filter(p => p.id !== photoId);
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Fotó törölve');
        }

        // ÚJ MÉRÉS RÖGZÍTÉSE MODÁL
        function openAddMeasurementModal(clientId) {
            const client = appData.clients.find(c => c.id === clientId);
            if (!client) return;
            const today = new Date().toISOString().slice(0, 10);

            openModal(`
                <form onsubmit="submitClientMeasurement(event, '${client.id}')" class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-heading font-bold text-lg">Új testmérés</h3>
                        <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-theme-subtle flex items-center justify-center"><i class="ph-bold ph-x"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Dátum</label>
                            <input type="date" name="date" value="${today}" required class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Testsúly (kg) *</label>
                            <input type="number" step="0.1" name="weight" value="${client.weight}" required class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Derék (cm)</label>
                            <input type="number" step="0.5" name="waist" placeholder="72" class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Csípő (cm)</label>
                            <input type="number" step="0.5" name="hips" placeholder="96" class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Kar (cm)</label>
                            <input type="number" step="0.5" name="arm" placeholder="29" class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-theme-muted mb-1">Comb (cm)</label>
                            <input type="number" step="0.5" name="thigh" placeholder="55" class="w-full px-3 py-2.5 bg-theme-card rounded-2xl text-sm border border-theme-border">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-theme-primary text-white font-heading font-bold text-sm rounded-2xl">Mérés mentése</button>
                </form>
            `);
        }

        function submitClientMeasurement(e, clientId) {
            e.preventDefault();
            const client = appData.clients.find(c => c.id === clientId);
            if (!client) return;
            const fd = new FormData(e.target);
            const weight = parseFloat(fd.get('weight')) || client.weight;
            client.weight = weight;
            if (!client.measurements) client.measurements = [];
            client.measurements.push({
                date: fd.get('date'),
                weight,
                waist: parseFloat(fd.get('waist')) || 0,
                hips: parseFloat(fd.get('hips')) || 0,
                arm: parseFloat(fd.get('arm')) || 0,
                thigh: parseFloat(fd.get('thigh')) || 0
            });
            saveAppData();
            closeModal();
            renderCurrentView();
            showToast('Mérés rögzítve!');
        }

        // DEMO VISSZAÁLLÍTÁS MODÁL
        function openResetDemoModal() {
            openModal(`
                <div class="space-y-4 text-center">
                    <h3 class="font-heading font-bold text-lg">Minta adatok visszaállítása?</h3>
                    <p class="text-xs text-theme-muted">Minden saját módosítás törlődik, és visszatöltődik a 3 minta vendég és edzéseik.</p>
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button onclick="closeModal()" class="py-3 bg-theme-subtle font-bold text-xs rounded-2xl">Mégse</button>
                        <button onclick="appData=JSON.parse(JSON.stringify(DEFAULT_DATA)); saveAppData(); closeModal(); switchTab('clients'); showToast('Minta adatok visszaállítva!');" class="py-3 bg-theme-primary text-white font-bold text-xs rounded-2xl">Visszaállítás</button>
                    </div>
                </div>
            `);
        }

        /**
         * HEVY SZÁMÍTÁSI ÉS ELŐZMÉNY SEGÉDFÜGGVÉNYEK
         */
        function getExerciseById(id) {
            return appData.exercises.find(e => e.id === id) || { id, name: 'Ismeretlen gyakorlat', muscle: 'Egyéb' };
        }

        // Kikeresi a vendég legutóbbi befejezett edzéséből az adott gyakorlat szettjeit
        function getPreviousSetsForClientExercise(clientId, exerciseId) {
            const clientWorkouts = appData.workoutHistory
                .filter(w => w.clientId === clientId)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            for (const w of clientWorkouts) {
                const found = w.exercises.find(ex => ex.exerciseId === exerciseId);
                if (found && found.sets && found.sets.length > 0) {
                    return found.sets;
                }
            }
            return [];
        }

        // Kikeresi a vendég eddigi legnagyobb súlyát az adott gyakorlatban (PR detektáláshoz)
        function getHistoricalMaxWeight(clientId, exerciseId) {
            let maxW = 0;
            appData.workoutHistory
                .filter(w => w.clientId === clientId)
                .forEach(w => {
                    const found = w.exercises.find(ex => ex.exerciseId === exerciseId);
                    if (found) {
                        found.sets.forEach(s => {
                            if (s.weight > maxW) maxW = s.weight;
                        });
                    }
                });
            return maxW;
        }

        function calculateWorkoutStats(workout) {
            let volume = 0;
            let completedSets = 0;
            let totalSets = 0;
            let prCount = 0;

            workout.exercises.forEach(ex => {
                ex.sets.forEach(s => {
                    totalSets++;
                    if (s.completed) {
                        completedSets++;
                        volume += (s.weight || 0) * (s.reps || 0);
                        if (s.isPR) prCount++;
                    }
                });
            });

            return { volume: Math.round(volume), completedSets, totalSets, prCount };
        }

        function formatDuration(sec) {
            const s = Math.max(0, sec || 0);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const remS = s % 60;
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
        }

        function formatDateHu(dateStr) {
            if (!dateStr) return '';
            const p = dateStr.split('-');
            return p.length === 3 ? `${p[0]}.${p[1]}.${p[2]}.` : dateStr;
        }

        function getInitials(name) {
            return (name || 'V').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Indítás
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(appData.studio.theme);
            updateHeaderUI();
            switchTab('clients');
        });
    </script>
